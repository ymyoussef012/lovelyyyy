<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>جاهزه 😉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="unlock-page">

    <!-- القلوب الخلفية: عددها ومواقعها ثابتة لتقريب لقطة الفيديو -->
    <div class="hearts" aria-hidden="true">
      <span class="heart h01">💗</span>
      <span class="heart h02">💗</span>
      <span class="heart h03">💖</span>
      <span class="heart h04">❤️</span>
      <span class="heart h05">💕</span>
      <span class="heart h06">💗</span>
      <span class="heart h07">💖</span>
      <span class="heart h08">❤️</span>
      <span class="heart h09">💗</span>
      <span class="heart h10">💖</span>
      <span class="heart h11">💕</span>
      <span class="heart h12">❤️</span>
      <span class="heart h13">💗</span>
      <span class="heart h14">💖</span>
      <span class="heart h15">❤️</span>
      <span class="heart h16">💕</span>
      <span class="heart h17">💗</span>
      <span class="heart h18">💖</span>
      <span class="heart h19">❤️</span>
      <span class="heart h20">💗</span>
      <span class="heart h21">💕</span>
      <span class="heart h22">💖</span>
      <span class="heart h23">❤️</span>
      <span class="heart h24">💗</span>
    </div>

    <section class="unlock-card">

      <div class="profile-ring">
        <img src="profile.jpg" alt="profile">
      </div>

      <div class="pink-heart-bg" aria-hidden="true"></div>

      <div class="content">
        <h1>😉 جاهزه</h1>
        <p>😍 كل الي بينا هنا</p>

        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          inputmode="text"
          autocomplete="off"
          spellcheck="false"
        >

        <button id="unlockBtn" type="button">💕 Unlock 💕</button>

        <div id="error"></div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
